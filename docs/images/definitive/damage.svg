<text x="30" y="506" font-size="19" fill="#f0efec" font-weight="800">Affinity: your Digimon's old resist stats, now an attack bonus</text>
<text x="30" y="532" font-size="15.5" fill="#c3c2b7">Each family's ceiling, times its stat's share of 999 (a pair: the two stats' sum, of 1998).</text>
