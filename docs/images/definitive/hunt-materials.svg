<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Common and rare Hunt Materials</title>
<desc id="desc">Common materials drop from any common Digimon defeated in a normal battle, by its level band, from Bit Shard to the Digizoids. Rare items drop only from Rare Targets, one per region, numbered like the target: Datamon IV drops Datamon Core IV. You hold commons as counts and rares as a collection, both shown in the Bestiary. Planned: the forge spends rares and large amounts of commons, the Black Market trades rares for commons, and a set of rares unlocks a DRI Gauntlet simulation.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans&quot;,&quot;Liberation Sans&quot;,sans-serif}</style>

<symbol id="i-fire" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0,-15 C5,-8 11,-3 10,5 C9.5,11 5,15 0,15 C-5,15 -10,11 -10,5 C-10,-1 -6,-4 -4,-9 C-2,-4 0,-2 2,-1 C4,-6 3,-10 0,-15 Z"/></symbol>
<symbol id="i-water" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0,-15 C5,-7 10,-1 10,5 A10,10 0 0 1 -10,5 C-10,-1 -5,-7 0,-15 Z"/></symbol>
<symbol id="i-ice" viewBox="-16 -16 32 32"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path transform="rotate(0)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(60)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(120)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(180)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(240)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(300)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/></g></symbol>
<symbol id="i-wind" viewBox="-16 -16 32 32"><g stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"><path d="M-14,-5 H4 C9,-5 10,-12 5,-12 C2,-12 1,-9 2,-8"/><path d="M-14,2 H9 C14,2 14,9 9,9 C6,9 5,6 6,5"/><path d="M-11,9 H-1"/></g></symbol>
<symbol id="i-thunder" viewBox="-16 -16 32 32"><path fill="currentColor" d="M4,-15 L-9,2 H-1 L-4,15 L9,-3 H1 Z"/></symbol>
<symbol id="i-machine" viewBox="-16 -16 32 32"><circle r="11" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="4.32 4.32"/><path fill="currentColor" fill-rule="evenodd" d="M9,0 A9,9 0 1 0 -9,0 A9,9 0 1 0 9,0 Z M3.5,0 A3.5,3.5 0 1 1 -3.5,0 A3.5,3.5 0 1 1 3.5,0 Z"/></symbol>
<symbol id="i-dark" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0.00,-15.00 L3.64,-5.02 L14.27,-4.64 L5.90,1.92 L8.82,12.14 L0.00,6.20 L-8.82,12.14 L-5.90,1.92 L-14.27,-4.64 L-3.64,-5.02 Z"/></symbol>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#9085e9" fill-opacity="0.28"/><rect width="3" height="7" fill="#9085e9"/></pattern>
<linearGradient id="ladder" x1="0" x2="1"><stop offset="0" stop-color="#8f8e88"/><stop offset="1" stop-color="#c98500"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c3c2b7"/></marker>
</defs>
<rect width="900" height="500" rx="16" fill="#171a21"/>
<text x="30" y="46" font-size="26" fill="#f0efec" font-weight="800">Common and rare Hunt Materials</text>
<text x="30" y="76" font-size="15.5" fill="#c3c2b7">Commons drop in every normal battle; rares only from Rare Targets, one per region.</text>
<rect x="30" y="100" width="290" height="170" rx="12" fill="#1f2430" stroke="#30374a" stroke-width="1.5"/>
<text x="50" y="132" font-size="17" fill="#f0efec" font-weight="700">Common materials</text>
<text x="50" y="160" font-size="15" fill="#c3c2b7">Any common Digimon you defeat in</text>
<text x="50" y="181" font-size="15" fill="#c3c2b7">a normal battle may drop one. Its</text>
<text x="50" y="202" font-size="15" fill="#c3c2b7">level band decides which:</text>
<rect x="50" y="228" width="250" height="10" rx="3" fill="url(#ladder)"/>
<text x="50" y="258" font-size="14" fill="#c3c2b7">Bit Shard</text>
<text x="300" y="258" font-size="14" fill="#c3c2b7" text-anchor="end">Digizoids</text>
<rect x="30" y="300" width="290" height="170" rx="12" fill="#1f2430" stroke="#30374a" stroke-width="1.5"/>
<text x="50" y="332" font-size="17" fill="#c98500" font-weight="700">Rare items</text>
<text x="50" y="360" font-size="15" fill="#c3c2b7">Only from Rare Targets: one per</text>
<text x="50" y="381" font-size="15" fill="#c3c2b7">region, numbered like the target</text>
<text x="50" y="402" font-size="15" fill="#c3c2b7">you met there.</text>
<rect x="50" y="422" width="250" height="32" rx="6" fill="#12151c" stroke="#3a4257" stroke-width="1.5"/>
<text x="175" y="443" font-size="14.5" fill="#f0efec" font-weight="700" text-anchor="middle">Datamon IV → Datamon Core IV</text>
<rect x="350" y="100" width="240" height="370" rx="12" fill="#1f2430" stroke="#30374a" stroke-width="1.5"/>
<text x="370" y="132" font-size="17" fill="#f0efec" font-weight="700">You hold them</text>
<text x="370" y="156" font-size="14.5" fill="#c3c2b7">and the Bestiary shows them</text>
<rect x="366" y="176" width="208" height="150" rx="6" fill="#12151c" stroke="#3a4257" stroke-width="1.5"/>
<text x="382" y="206" font-size="14.5" fill="#c3c2b7" font-weight="700">Common</text>
<text x="382" y="230" font-size="15" fill="#f0efec">Bit Shard</text>
<text x="558" y="230" font-size="15" fill="#f0efec" font-weight="700" text-anchor="end">x12</text>
<line x1="378" y1="250" x2="562" y2="250" stroke="#3a4257" stroke-width="1.2"/>
<text x="382" y="278" font-size="14.5" fill="#c98500" font-weight="700">Rare</text>
<text x="382" y="302" font-size="15" fill="#f0efec">Rare Cores</text>
<text x="558" y="302" font-size="15" fill="#f0efec" font-weight="700" text-anchor="end">4/13</text>
<text x="370" y="360" font-size="15" fill="#c3c2b7">Commons pile up in</text>
<text x="370" y="381" font-size="15" fill="#c3c2b7">counts; rares are a</text>
<text x="370" y="402" font-size="15" fill="#c3c2b7">collection to complete,</text>
<text x="370" y="423" font-size="15" fill="#c3c2b7">region by region.</text>
<line x1="322" y1="185" x2="346" y2="185" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="322" y1="385" x2="346" y2="385" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="620" y="100" width="250" height="110" rx="10" fill="none" stroke="#646a78" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="638" y="130" font-size="17" fill="#f0efec" font-weight="700">Forge</text>
<text x="852" y="129" font-size="13.5" fill="#9a9a94" font-weight="800" text-anchor="end" letter-spacing="1.2">PLANNED</text>
<text x="638" y="158" font-size="15" fill="#c3c2b7">Rares plus large amounts</text>
<text x="638" y="179" font-size="15" fill="#c3c2b7">of commons: better gear</text>
<line x1="592" y1="285" x2="616" y2="155" stroke="#c3c2b7" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="620" y="230" width="250" height="110" rx="10" fill="none" stroke="#646a78" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="638" y="260" font-size="17" fill="#f0efec" font-weight="700">Black Market</text>
<text x="852" y="259" font-size="13.5" fill="#9a9a94" font-weight="800" text-anchor="end" letter-spacing="1.2">PLANNED</text>
<text x="638" y="288" font-size="15" fill="#c3c2b7">Trade rare items for</text>
<text x="638" y="309" font-size="15" fill="#c3c2b7">common materials</text>
<line x1="592" y1="285" x2="616" y2="285" stroke="#c3c2b7" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="620" y="360" width="250" height="110" rx="10" fill="none" stroke="#646a78" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="638" y="390" font-size="17" fill="#f0efec" font-weight="700">DRI Gauntlet</text>
<text x="852" y="389" font-size="13.5" fill="#9a9a94" font-weight="800" text-anchor="end" letter-spacing="1.2">PLANNED</text>
<text x="638" y="418" font-size="15" fill="#c3c2b7">A set of rares unlocks an</text>
<text x="638" y="439" font-size="15" fill="#c3c2b7">evolution-line simulation</text>
<line x1="592" y1="285" x2="616" y2="415" stroke="#c3c2b7" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
