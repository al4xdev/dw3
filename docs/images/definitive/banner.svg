<rect width="900" height="260" rx="16" fill="#171a21"/>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121520"/><stop offset="1" stop-color="#232a3d"/></linearGradient></defs>
<rect width="900" height="260" rx="16" fill="url(#bg)"/>
<text x="48" y="98" font-size="48" fill="#f0efec" font-weight="800">Digimon World 3</text>
<text x="51" y="138" font-size="21" fill="#e0662f" font-weight="800" letter-spacing="6">DEFINITIVE EDITION</text>
<text x="50" y="184" font-size="17" fill="#c3c2b7">Find the weakness. Stagger. One more. Pass the baton.</text>
<text x="50" y="216" font-size="14.5" fill="#9a9a94">A PS1 recompilation, native on RK3326 handhelds and PC</text>
