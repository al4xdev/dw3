# The release (docs/RELEASE.md): one Linux x86_64 AppImage, one Windows x86_64 zip, and the PortMaster ARM (armhf)
# zip (`dw3.zip`), built on ubuntu-24.04. Players bring their own disc and never compile anything; nothing of the disc
# is ever packed (scripts/check_release_contents.py holds every package to the list of files a release has, before it
# is kept and again before it is published).
#
# When it runs:
#   - a pushed tag vX.Y.Z (v0.3.0, also v0.3.0-rc1; not the decomp's milestone tags such as v0.1-matching-closed):
#     all three packages, then a GitHub Release for the tag with every file and generated notes, published (a
#     pre-release when the tag has a suffix; a draft instead when the repository variable RELEASE_DRAFT is "true"),
#     and (when PORTMASTER_REPO_TOKEN is set) synced to al4xdev/PortMaster-MV-New + its release workflow triggered;
#   - by hand (Actions > Release > Run workflow; `gh workflow run release.yml --ref <branch> [-f tag=v0.3.0]`): all
#     three packages as the run's artifacts (kept 30 days); with `tag`, the release too, the tag created on the run's
#     commit when the repository has none. `sync_portmaster=true` also syncs PortMaster-MV-New on a manual run.
# The disc is optional. With the maintainers' secret GAMEDATA_DEPLOY_KEY (a read-only deploy key of the private data
# checkout <owner>/dw2003-gamedata) the game's Release build passes the port's M1 test and both PC smoke tests run the
# bundled game on the disc; without it each PC package gets the disc-free smoke test.
# With the repository variable RELEASE_RUN_CI = "true" the whole of ci.yml runs first and a failure there stops the
# release; otherwise tag a commit whose CI is green.
# psxstack, the submodule, is fetched by actions/checkout at its pin: nothing to set while al4xdev/dw3-psxstack is
# public; if it is private, the secret PSXSTACK_TOKEN (a token that can read it) is used instead of the run's own.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release for this tag (vX.Y.Z...). Empty: build the packages only (the run's artifacts)"
        type: string
        default: ""
      draft:
        description: "Create the release as a draft (published later by hand)"
        type: boolean
        default: false
      sync_portmaster:
        description: "Also sync ports/dw3/ and trigger PortMaster-MV-New release (requires PORTMASTER_REPO_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # The version in the file names and the programs' stamp: a manual run's tag. Empty on a tag push (the package
  # scripts read the tag from GITHUB_REF) and on a manual run without one (git describe: dev-<commit>).
  DW3_VERSION: ${{ inputs.tag }}
  DW3_JOBS: "4"

jobs:
  tests:
    name: Tests (ci.yml)
    if: vars.RELEASE_RUN_CI == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  appimage:
    name: AppImage
    needs: tests
    # tests is skipped unless RELEASE_RUN_CI: run then too, but not after it failed.
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DW3_GAMEDATA: ${{ github.workspace }}/dw2003-gamedata
      DW3_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu   # as ci.yml: the runners' own mirror
      HAS_DATA: ${{ secrets.GAMEDATA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe: a manual run's version
          submodules: recursive
          token: ${{ secrets.PSXSTACK_TOKEN || github.token }}

      - name: The pins (psxstack, the tool cache's key)
        id: pins
        run: |
          echo "psxstack at $(git -C psxstack describe --tags --always)"
          echo "hash=$({ scripts/setup.sh --pins; cat tools/requirements.txt; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Data checkout (maintainers only)
        if: env.HAS_DATA == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dw2003-gamedata
          ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
          path: dw2003-gamedata

      # The desktop SDL's -dev packages (X11, Wayland, PipeWire, PulseAudio, ALSA, ...): setup.sh lists them.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cmake xz-utils $(scripts/setup.sh --sdl3-desktop-apt)

      # Its own cache: CI's tools/sdl3 is headless (no desktop -dev packages there), tools/sdl3-desktop never is.
      - name: Cached release tools
        uses: actions/cache@v4
        with:
          path: |
            tools/venv
            tools/mkpsxiso
            tools/imgui
            tools/sdl3-desktop
            tools/appimage
            tools/dxc
          key: tools-release-${{ runner.os }}-${{ steps.pins.outputs.hash }}

      # mkpsxiso: worktree_init.sh extracts the disc (the port's sound check reads the EXE from extracted/).
      - name: Release tools
        run: scripts/setup.sh venv mkpsxiso imgui sdl3-desktop appimage dxc

      - name: Disc from the data checkout
        if: env.HAS_DATA == 'true'
        run: |
          scripts/worktree_init.sh
          test -f iso/dw2003.cue

      # The release's game is a Release build (the runtime at -O3, the game's C at -O0: port/CMakeLists.txt), the
      # tests' have the default flags: its headless build must replay the layer-2 scripts the same way (the emulator's
      # checkpoints, two identical runs).
      - name: The game's Release build passes the port's M1 test
        if: env.HAS_DATA == 'true'
        run: |
          cmake -S port -B build/port -G Ninja -DCMAKE_BUILD_TYPE=Release
          tools/venv/bin/python tests/port/run.py

      # --test: the launcher's self-test inside the AppImage with the bundled game and mods, and the game's 300 frames
      # on the disc when iso/dw2003.cue exists.
      - name: Build the AppImage and smoke-test it
        run: scripts/package_appimage.sh --test

      # What ships is the AppImage's own tree: unpacked (no FUSE needed) and held to the list.
      - name: Only programs, manifests and licences in it
        run: |
          rm -rf build/release/contents && mkdir -p build/release/contents
          image="$(ls "$PWD"/build/release/*.AppImage)"
          (cd build/release/contents && "$image" --appimage-extract >/dev/null)
          python3 scripts/check_release_contents.py appimage build/release/contents/squashfs-root

      - name: Keep the AppImage (the run's artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dw2003-appimage
          path: |
            build/release/*.AppImage
            build/release/*.debug
            build/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-appimage
          path: |
            crash-*.txt
            build/release/self-test/**/crash-*.txt
          if-no-files-found: ignore

  # The Windows package, cross-built on the same runner (ci.yml's windows job has the toolchain's cache and the Wine
  # setup; this job repeats them). Tested unzipped under Wine (package_windows.sh --test): the launcher's self-test with
  # the bundled game and mods; with the disc also the game's run and a forced crash symbolized with the symbols zip's PDB.
  windows:
    name: Windows package
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DW3_GAMEDATA: ${{ github.workspace }}/dw2003-gamedata
      DW3_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
      HAS_DATA: ${{ secrets.GAMEDATA_DEPLOY_KEY != '' }}
      WINEDEBUG: "-all"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PSXSTACK_TOKEN || github.token }}

      - name: psxstack at its pin
        run: echo "psxstack at $(git -C psxstack describe --tags --always)"

      - name: Data checkout (maintainers only)
        if: env.HAS_DATA == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dw2003-gamedata
          ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
          path: dw2003-gamedata

      # wine64 alone: no 32-bit multiarch (the binaries are x86_64; `wine` is the launcher script the tests call).
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ninja-build cmake xz-utils wine wine64

      - name: Cached Windows toolchain
        uses: actions/cache@v4
        with:
          path: |
            tools/venv
            tools/mkpsxiso
            tools/imgui
            tools/llvm-mingw
            tools/sdl3-windows
            tools/dxc
          key: tools-windows-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'tools/requirements.txt') }}

      - name: Windows toolchain
        run: scripts/setup.sh venv mkpsxiso imgui llvm-mingw sdl3-windows dxc

      - name: Wine prefix
        run: |
          mkdir -p build/wine-prefix
          WINEPREFIX="$PWD/build/wine-prefix" wineboot --init
          wine --version

      - name: Disc from the data checkout
        if: env.HAS_DATA == 'true'
        run: |
          scripts/worktree_init.sh
          test -f iso/dw2003.cue

      - name: Build the Windows package and test it under Wine
        timeout-minutes: 40
        run: scripts/package_windows.sh --test

      - name: Only programs, manifests and licences in it
        run: |
          zip="$(ls build/release/*-windows-x86_64.zip)"
          python3 scripts/check_release_contents.py windows "$zip" "${zip%.zip}-symbols.zip"

      - name: Keep the Windows package (the run's artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dw2003-windows
          path: |
            build/release/*-windows-x86_64.zip
            build/release/*-windows-x86_64-symbols.zip
            build/release/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 30

      # The build's own log first: package_windows.sh shows only its last lines (build_windows.sh's summary names the
      # objects that did not compile and the errors by kind).
      - name: Build logs and crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-logs
          # Not build/**: the Wine prefix's dosdevices/z: links to /, which the glob cannot walk.
          path: |
            build/release/windows/build.log
            build/port-win.*.log
            build/launcher-win.*.log
            crash-*.txt
            build/release/windows/test/**/crash-*.txt
          if-no-files-found: ignore

  portmaster:
    name: PortMaster (armhf)
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PSXSTACK_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM cross-compile image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile.armhf
          load: true
          tags: dw3-armhf-builder:latest
          cache-from: type=gha,scope=armhf-builder
          cache-to: type=gha,scope=armhf-builder,mode=max

      - name: Cross-compile ARM binary (armhf)
        env:
          DW3_BUILD_ONLY: "1"
          DW3_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          tools/build_arm.sh
          file build/armhf-sdl2/dw2003
          readelf -d build/armhf-sdl2/dw2003 | grep NEEDED

      - name: Assemble and check dw3.zip
        run: |
          (cd portmaster && ./make_release.sh)
          python3 scripts/check_release_contents.py portmaster dist/dw3.zip
          (cd dist && sha256sum -c SHA256SUMS-portmaster)

      - name: Keep the PortMaster package (the run's artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dw2003-portmaster
          path: |
            dist/dw3.zip
            dist/SHA256SUMS-portmaster
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: [appimage, windows, portmaster]
    # Explicit results: the default success() would skip this job whenever `tests` was skipped.
    if: ${{ !cancelled() && needs.appimage.result == 'success' && needs.windows.result == 'success' && needs.portmaster.result == 'success' && (github.ref_type == 'tag' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # gh release create / upload
    steps:
      # The checker only (the release job builds nothing).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check_release_contents.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: dw2003-appimage
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dw2003-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dw2003-portmaster
          path: dist

      - name: The release's files (names, checksums, the zips' contents)
        run: |
          python3 scripts/check_release_contents.py dist dist
          cd dist && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS-windows && sha256sum -c SHA256SUMS-portmaster

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          DRAFT: ${{ (inputs.draft || vars.RELEASE_DRAFT == 'true') && 'true' || 'false' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]] || { echo "::error::not a release tag: '$TAG' (vX.Y.Z...)"; exit 1; }
          cd dist
          files=(./*.AppImage ./*.debug ./*-windows-x86_64.zip ./*-windows-x86_64-symbols.zip ./dw3.zip SHA256SUMS SHA256SUMS-windows SHA256SUMS-portmaster)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            echo "### Updated release $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flags=()
          [[ "$DRAFT" == true ]] && flags+=(--draft)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # --target: a manual run's tag that does not exist yet is created on the commit the packages were built from.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "Digimon World 3: Definitive Edition $TAG" --generate-notes --notes "The PC & handheld builds: the launcher, the game and its mods, for Linux x86_64, Windows x86_64 and RK3326 PortMaster (armhf).
          Bring your own disc image of Digimon World 2003 (PS1, Europe, raw .bin + .cue; the launcher checks its SHA-1). These files hold no game data.

          **Linux x86_64**: \`dw2003-*-x86_64.AppImage\`: \`chmod +x\` it, then run it. Needs glibc 2.39 or newer (Ubuntu 24.04, Fedora 40, Debian 13 or later).
          **Windows x86_64**: \`dw2003-*-windows-x86_64.zip\`: unzip, run \`dw2003-launcher.exe\` (unsigned: SmartScreen's \"More info\", \"Run anyway\"). Windows 10 or newer. Tested on Linux under Wine; reports from real Windows are welcome in the issues.
          **PortMaster (RK3326 armhf)**: \`dw3.zip\`: unpack into \`ports/\` and put your \`.bin\` + \`.cue\` in \`ports/dw3/game/\`.
          **Widescreen battles**: the launcher's Mods screen; it needs Video > Renderer \"gpu\".
          The .debug file and the -symbols.zip are the programs' debug info for crash reports (not needed to play)." \
            "${files[@]}"
          echo "### Release $TAG ($([[ $DRAFT == true ]] && echo draft || echo published))" >> "$GITHUB_STEP_SUMMARY"

  sync-portmaster:
    name: Sync to PortMaster-MV-New
    needs: [portmaster, release]
    if: ${{ !cancelled() && needs.portmaster.result == 'success' && needs.release.result != 'failure' && (github.ref_type == 'tag' || inputs.tag != '' || inputs.sync_portmaster) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PM_REPO: al4xdev/PortMaster-MV-New
      HAS_PM_TOKEN: ${{ secrets.PORTMASTER_REPO_TOKEN != '' }}
    steps:
      - name: Check PortMaster sync token
        if: env.HAS_PM_TOKEN != 'true'
        run: |
          echo "### PortMaster sync skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository secret \`PORTMASTER_REPO_TOKEN\` (PAT with Contents: write + Actions: write on \`$PM_REPO\`) to automatically update \`ports/dw3/\` and trigger \`release.yaml\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        if: env.HAS_PM_TOKEN == 'true'
        with:
          name: dw2003-portmaster
          path: dist

      - uses: actions/checkout@v4
        if: env.HAS_PM_TOKEN == 'true'
        with:
          repository: ${{ env.PM_REPO }}
          token: ${{ secrets.PORTMASTER_REPO_TOKEN }}
          path: pm-repo

      - name: Update ports/dw3 and push to PortMaster-MV-New
        if: env.HAS_PM_TOKEN == 'true'
        id: sync
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          rm -rf pm-repo/ports/dw3
          mkdir -p pm-repo/ports/dw3
          unzip -oq dist/dw3.zip -d pm-repo/ports/dw3
          chmod +x "pm-repo/ports/dw3/Digimon World 3.sh" pm-repo/ports/dw3/dw3/dw2003 pm-repo/ports/dw3/dw3/dw3-menu.py
          [ -f pm-repo/ports/dw3/dw3/ledd.py ] && chmod +x pm-repo/ports/dw3/dw3/ledd.py
          [ -f pm-repo/ports/dw3/dw3/probe.sh ] && chmod +x pm-repo/ports/dw3/dw3/probe.sh
          cd pm-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ports/dw3
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ports/dw3 is already up to date in $PM_REPO."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          label="${TAG:-${GITHUB_SHA::7}}"
          git commit -m "dw3: update Definitive Edition ($label)"
          git push origin main

      - name: Trigger PortMaster-MV-New release workflow
        if: env.HAS_PM_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.PORTMASTER_REPO_TOKEN }}
        run: |
          gh workflow run release.yaml -R "$PM_REPO" --ref main
          echo "### Synced \`ports/dw3\` and triggered \`release.yaml\` on \`$PM_REPO\`" >> "$GITHUB_STEP_SUMMARY"
